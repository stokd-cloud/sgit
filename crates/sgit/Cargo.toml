[package]
name = "sgit"
version = "0.2.2"
edition = "2021"
description = "Standalone git/repo/worktree CLI built on sgit-core"
authors = ["Stokd Team"]
license = "MIT"

[[bin]]
name = "sgit"
path = "src/main.rs"

# Match apps/cli: warnings are hard errors.
[lints.rust]
warnings = "deny"

[dependencies]
clap = { version = "4", features = ["derive"] }
sgit-core = { path = "../sgit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "json"], default-features = false }
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"
