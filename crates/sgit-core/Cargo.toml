[package]
name = "sgit-core"
version = "0.2.2"
edition = "2021"
description = "Generic git/repo/worktree library for sgit and stokd"
authors = ["Stokd Team"]
license = "MIT"

[lib]
name = "sgit_core"
path = "src/lib.rs"

# Match apps/cli: warnings are hard errors so scaffold stays clean.
[lints.rust]
warnings = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
dirs = "5"
libc = "0.2"

# Biometric lock gate (`biometric.rs`): Touch ID via an ephemeral biometry-gated
# Secure Enclave key — the proven unentitled path from stokd's governance
# signer, trimmed to a presence check.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

# Biometric lock gate on Windows: the WinRT `UserConsentVerifier` Hello prompt,
# anchored to the console/desktop window via the interop factory.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"

[dev-dependencies]
tempfile = "3"
