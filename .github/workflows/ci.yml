name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    name: cargo build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p sgit -p sgit-core

      # Tests that commit into fixtures need an identity. Actions runners
      # have none, which is why apply_divergent_cluster_falls_back_to_suffix
      # has been red on main.
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@sgit.selfactor.io"
          git config --global user.name "sgit-ci"

      - name: Test
        run: cargo test --workspace

  terraform:
    name: terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        run: terraform fmt -check -recursive terraform

      - name: Validate
        run: |
          terraform -chdir=terraform/live init -backend=false -input=false
          terraform -chdir=terraform/live validate

      - name: Scripts
        run: |
          bash -n scripts/done.sh
          bash -n scripts/build-site.sh
          bash scripts/build-site.sh
