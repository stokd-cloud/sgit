# Optional remote plan. Runs only when AWS credentials are configured
# as repository secrets. Does not apply.
name: Terraform plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "site/**"
      - "scripts/done.sh"
      - "scripts/build-site.sh"
      - "package.json"
      - ".github/workflows/terraform-plan.yml"

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    if: ${{ vars.SGIT_HOSTED_ZONE_ID != '' && secrets.AWS_ROLE_ARN != '' }}
    permissions:
      contents: read
      id-token: write
    env:
      SGIT_HOSTED_ZONE_ID: ${{ vars.SGIT_HOSTED_ZONE_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
      TF_STATE_KEY: sgit/prod/terraform.tfstate
      STOKD_DONE_DRY_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Plan
        run: bash scripts/done.sh prod
